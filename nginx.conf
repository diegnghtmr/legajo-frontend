# Legajo frontend — nginx server block. Copied by the Dockerfile
# to /etc/nginx/conf.d/default.conf, replacing nginx-unprivileged's default
# welcome-page config; the base image's main nginx.conf still supplies the
# surrounding http {} block (mime types, logging, etc.).
#
# Runs under nginxinc/nginx-unprivileged, so the app listens on :8080 inside
# the container (unprivileged ports only); the host-facing :80 is a port
# *mapping* done by whoever runs the image (e.g.
# `-p 80:8080`, or the backend repo's Compose service), not this file.
server {
    listen       8080;
    server_name  _;

    # Don't advertise the nginx version in error pages/headers.
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                       image/svg+xml application/xml font/woff2;

    # Baseline security headers (no MIME-sniffing, no framing, a conservative
    # Referrer-Policy). No Content-Security-Policy connect-src here: the app
    # calls a *different-origin* API at runtime (VITE_API_BASE_URL, e.g. the
    # deployed Render backend), an origin this static image does not know at
    # nginx-config time, so a restrictive connect-src would break those
    # calls. There are three location blocks below (`= /index.html`,
    # `/assets/`, and `/`); nginx's `add_header` does NOT inherit into a
    # location block that declares its own `add_header` at all, and two of
    # those three (`= /index.html`, `/assets/`) already declare their own
    # Cache-Control — a directive declared only here at the server level
    # would be silently dropped for those two. So these three security
    # header lines are repeated in all three location blocks below, not
    # declared once here.

    # The SPA shell must never be cached: every deploy has to be picked up on
    # the next load, even though the hashed assets it references are
    # long-cached (below).
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed build output: the filename changes whenever the content
    # does, so it is safe to cache for a year and mark immutable.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unmatched path (a client-side route such as
    # /clustering) is served index.html so React Router can take over. A
    # path that exists as a real file under this location is served here
    # directly, so this block's own header copy is what applies to it; a
    # path that does not exist triggers try_files' internal redirect to
    # /index.html, which nginx re-matches against location blocks and so
    # picks up `location = /index.html`'s headers instead.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
