name: frontend

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: neither job pushes, comments, or otherwise writes
# anything back to the repository or its GITHUB_TOKEN-scoped resources.
permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Design token conformance (no hex outside @theme)
        run: npm run check:tokens

      - name: Unit and contract-type tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: API types drift (contract vs generated types)
        run: |
          npm run api:types
          git diff --exit-code src/shared/types/api.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright + axe)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Builds the shipped container image and checks that it actually serves the
  # SPA correctly (TRD §14.2/§14.3): root document, SPA fallback on a deep
  # route, and the cache headers on index.html vs. hashed assets. Independent
  # of the `ci` job above; it never touches host Node, only Docker.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8080 \
            -t legajo-frontend:ci .

      # Cheap on top of the successful build above: only the ARG-guard layer
      # and anything after it are cache-invalidated by a different build-arg
      # value (everything before it — npm ci, COPY — hits the existing
      # cache), and the guard fails before the expensive `npm run build`
      # layer ever runs. Guards against the required-arg check regressing
      # back to a silent default.
      - name: Negative test - build fails without VITE_API_BASE_URL
        run: |
          if docker build -t legajo-frontend:negative-test . ; then
            echo "ERROR: docker build succeeded without --build-arg VITE_API_BASE_URL; the required-arg guard regressed." >&2
            exit 1
          fi
          echo "OK: build correctly failed without --build-arg VITE_API_BASE_URL"

      - name: Run container
        run: docker run -d --name legajo-frontend-smoke -p 8081:8080 legajo-frontend:ci

      # No separate wait step: scripts/smoke-image.sh has its own bounded
      # readiness wait (30s, polling the container directly), so it can run
      # right after `docker run` with no blind `sleep` in this workflow.
      - name: Image smoke test
        run: |
          docker run --rm --network host \
            -v "$PWD":/workspace:ro -w /workspace \
            curlimages/curl:8.15.0 sh scripts/smoke-image.sh http://localhost:8081

      - name: Container logs on failure
        if: failure()
        run: docker logs legajo-frontend-smoke

      - name: Clean up container
        if: always()
        run: docker rm -f legajo-frontend-smoke
