name: frontend

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: neither job pushes, comments, or otherwise writes
# anything back to the repository or its GITHUB_TOKEN-scoped resources.
permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Design token conformance (no hex outside @theme)
        run: npm run check:tokens

      - name: Unit and contract-type tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: API types drift (contract vs generated types)
        run: |
          npm run api:types
          git diff --exit-code src/shared/types/api.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright + axe)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Regression tests for the helper SCRIPTS themselves (scripts/tests/),
  # previously documented in README.md as container checks but never
  # actually wired into CI. Independent of `ci`/`image-smoke`/`fullstack-e2e`:
  # it never touches host Node, only Docker (each script runs the exact
  # shipped shell code inside a pinned image, per its own header comment).
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: VITE_API_BASE_URL trim/validate guard
        run: scripts/tests/api-base-url-guard.test.sh

      - name: docker-volume.sh volume-ownership helper
        run: scripts/tests/docker-volume.test.sh

      - name: fullstack-stale-reclaim.sh stale-project reclaim decision
        # Requires the hidepid=2 case (see that test's own comment) to
        # actually run here rather than report itself skipped: GitHub's
        # Ubuntu runners are expected to always support the CAP_SYS_ADMIN
        # + apparmor=unconfined that one case's own container asks for.
        env:
          LEGAJO_STALE_RECLAIM_REQUIRE_HIDEPID: '1'
        run: scripts/tests/fullstack-stale-reclaim.test.sh

  # Builds the shipped container image and checks that it actually serves the
  # SPA correctly (TRD §14.2/§14.3): root document, SPA fallback on a deep
  # route, and the cache headers on index.html vs. hashed assets. Independent
  # of the `ci` job above; it never touches host Node, only Docker.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8080 \
            -t legajo-frontend:ci .

      # Cheap on top of the successful build above: only the ARG-guard layer
      # and anything after it are cache-invalidated by a different build-arg
      # value (everything before it — npm ci, COPY — hits the existing
      # cache), and the guard fails before the expensive `npm run build`
      # layer ever runs. Guards against the required-arg check regressing
      # back to a silent default.
      #
      # A build failing is not, on its own, proof of that: a network error,
      # a Docker daemon hiccup, or a base-image pull failure would also make
      # `docker build` exit non-zero, and would wrongly pass a check that
      # only looked at the exit code. So this also asserts the captured
      # output actually contains the guard's own message.
      - name: Negative test - build fails without VITE_API_BASE_URL
        run: |
          set +e
          docker build -t legajo-frontend:negative-test . >negative-build.log 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -eq 0 ]; then
            echo "ERROR: docker build succeeded without --build-arg VITE_API_BASE_URL; the required-arg guard regressed." >&2
            cat negative-build.log >&2
            exit 1
          fi
          if ! grep -q "VITE_API_BASE_URL is required" negative-build.log; then
            echo "ERROR: docker build failed without --build-arg VITE_API_BASE_URL, but not with the expected guard message — this looks like an unrelated build failure (network, Docker daemon, base image pull, ...), not proof the required-arg guard is working." >&2
            cat negative-build.log >&2
            exit 1
          fi
          echo "OK: build correctly failed without --build-arg VITE_API_BASE_URL, with the expected guard message"

      - name: Run container
        run: docker run -d --name legajo-frontend-smoke -p 8081:8080 legajo-frontend:ci

      # No separate wait step: scripts/smoke-image.sh has its own bounded
      # readiness wait (30s, polling the container directly), so it can run
      # right after `docker run` with no blind `sleep` in this workflow.
      - name: Image smoke test
        run: |
          docker run --rm --network host \
            -v "$PWD":/workspace:ro -w /workspace \
            curlimages/curl:8.15.0 sh scripts/smoke-image.sh http://localhost:8081

      - name: Container logs on failure
        if: failure()
        run: docker logs legajo-frontend-smoke

      - name: Clean up container
        if: always()
        run: docker rm -f legajo-frontend-smoke

  # Full-stack e2e against the real backend, no mocks (F3/F4, TRD
  # §14.3/1.3.11): checks out the sibling backend repository with a
  # read-only deploy key, brings up both services from the backend's own
  # docker-compose.yml (task K4), and runs e2e-fullstack/ against them.
  # Independent of `ci` and `image-smoke` above.
  #
  # A pull request from a FORK cannot read this repository's secrets, so
  # LEGAJO_BACKEND_DEPLOY_KEY would be empty for one — GitHub restricts, but
  # does not categorically forbid, forking a private repository (an org can
  # explicitly allow it for members with access), so this is a real,
  # reachable case here, not a theoretical one for a public repository. The
  # verify step below still fails the job either way (never a silent skip),
  # but distinguishes that expected case from an actually missing/misspelled
  # secret with a more specific message.
  fullstack-e2e:
    runs-on: ubuntu-latest
    # Covers a COLD run with real margin, not just the happy path: every
    # step here starts from a fresh GitHub-hosted runner with no Docker
    # layer cache, so `docker compose up --build` builds BOTH images from
    # scratch (backend: Gradle dependency resolution plus a Java 25/Spring
    # Boot 4 compile; frontend: npm install plus a Vite production build),
    # `--wait` then polls both healthchecks, the Playwright container runs
    # its own `npm ci` into a volume that is also empty on a fresh runner,
    # and only then does the full-stack suite itself run (a handful of
    # specs with axe scans, with CI's own `retries: 2` in
    # playwright.fullstack.config.ts able to re-run a flaky one). Each of
    # those steps is minutes, not seconds, on a shared runner; 20 minutes
    # left too little room for a genuinely cold run plus a slow runner, so
    # this is padded to 30 rather than tuned to a single measured run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Fails loudly, by name, before the next step ever runs — never a
      # silent skip and never a generic downstream auth error from
      # actions/checkout. The secret is passed through `env:`, never
      # interpolated into the `run:` script text, so a shell expansion
      # mistake can never end up echoing or otherwise exposing it.
      - name: Verify LEGAJO_BACKEND_DEPLOY_KEY is set
        env:
          DEPLOY_KEY: ${{ secrets.LEGAJO_BACKEND_DEPLOY_KEY }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "FAILING: this run is a pull request from a fork, so GitHub does not" >&2
              echo "  expose repository secrets to it — LEGAJO_BACKEND_DEPLOY_KEY is" >&2
              echo "  unavailable here by design, not by misconfiguration. The full-stack" >&2
              echo "  e2e job cannot run for a fork PR; it runs on push to main and on a" >&2
              echo "  same-repository PR." >&2
            else
              echo "ERROR: the LEGAJO_BACKEND_DEPLOY_KEY secret is empty or missing." >&2
              echo "  This job needs it to check out diegnghtmr/legajo-backend read-only" >&2
              echo "  (TRD §14.3/1.3.11); it must never be skipped silently." >&2
            fi
            exit 1
          fi

      - name: Checkout legajo-backend (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: diegnghtmr/legajo-backend
          ssh-key: ${{ secrets.LEGAJO_BACKEND_DEPLOY_KEY }}
          path: legajo-backend
          ref: main
          # No later step needs continued git/SSH access to legajo-backend —
          # only its checked-out FILES, for `docker compose`. Least
          # privilege: don't leave the deploy key wired into git config for
          # the rest of the job (e.g. reachable to whatever `docker build`
          # runs next), when nothing after this step uses it.
          persist-credentials: false

      # scripts/e2e-fullstack-in-docker.sh brings the Compose stack up,
      # builds this checkout's own frontend image into it, runs the
      # no-mocks suite, and always tears the stack down (its own trap),
      # dumping Compose logs on failure.
      - name: Full-stack e2e (no mocks)
        run: LEGAJO_BACKEND_DIR=legajo-backend scripts/e2e-fullstack-in-docker.sh

      - name: Upload full-stack Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fullstack
          path: |
            playwright-report-fullstack/
            test-results-fullstack/
          # A failure before Playwright ever ran (e.g. `docker compose up`
          # itself failing) leaves neither directory on disk; warn instead
          # of failing the upload step itself and masking the real error.
          if-no-files-found: warn
          retention-days: 7
