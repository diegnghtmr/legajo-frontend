name: frontend

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: .

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Design token conformance (no hex outside @theme)
        run: npm run check:tokens

      - name: Unit and contract-type tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: API types drift (contract vs generated types)
        run: |
          npm run api:types
          git diff --exit-code src/shared/types/api.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright + axe)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
